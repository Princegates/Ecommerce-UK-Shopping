# Fly.io: fly launch --no-deploy --copy-config   then set secrets (see DEPLOY.md) and: fly deploy
app = "your-shop-name"
primary_region = "lhr"

[build]

[env]
  DATABASE_PATH = "/data/shop.db"
  NODE_ENV = "production"
  PORT = "3000"

[mounts]
  source = "shopdata"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # keep one machine always on: the catalogue scheduler and message retries run inside it
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
